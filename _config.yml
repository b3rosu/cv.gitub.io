# about_title: About Me
about_profile_image: images/profile.jpg
about_content: | # this will include new lines to allow paragraphs
  Hi, I'm Bernabe. I've been working in IT for over three years, with two of those focused on full-stack development.
  I'm driven by continuous learning—always experimenting with new technologies and finding ways to automate and build efficient solutions.
  I have experience managing both Linux and Windows servers, though Linux is where I thrive.
  I'm most skilled in <mark>Linux</mark>, <mark>JavaScript</mark> & <mark>networking</mark>.

content:
  - title: Experience # Title for the section
    layout: list # Type of content section (list/text)
    content:
      - layout: left
        title: Moti Digital
        sub_title: ERP Leader & Lead Full-Stack Developer
        caption: 2024 - Present
        quote: >
          Promoted through roles: IT Intern → IT Analyst → IT Leader → ERP Leader
        description: | # this will include new lines to allow paragraphs
          Architected, developed, and deployed internal tools, custom ERP modules, and IT infrastructure over the past 2+ years.

          **Full-Stack Development & Internal Tools:**
          - Built unified internal SPAs with <mark>React</mark>, <mark>MUI</mark>, <mark>Material React Table</mark>, and <mark>TanStack Query</mark>, featuring client-side PDF, Excel, and image generation in vanilla JS.
          - Engineered REST API backends with <mark>Bun</mark> and <mark>Express</mark>, including JWT authentication with RBAC, <mark>PostgreSQL</mark> and <mark>MongoDB</mark> databases, SOAP integrations with the ERP, and <mark>MinIO</mark> object storage.
          - Replaced legacy internal Excel files with real-time web dashboards and custom CRUD tools.

          **ERP Customization & Data Solutions:**
          - Administered and customized <mark>EFI Pace</mark> ERP, designing an Easy Quote module and a simplified custom MRP system tailored to company needs.
          - Migrated Power BI reports to high-performance web dashboards with real-time data from EFI Pace and CONTPAQi.

          **Operations, Logistics & Automation:**
          - Integrated <mark>FedEx</mark> and <mark>DHL</mark> APIs for automated, real-time delivery status updates.
          - Built an automated warehouse flow that supplies materials to production areas based on current demand.
          - Designed a barcode-driven production tracking system (scanning task and employee codes) to simplify activity logging.
          - Developed a mobile delivery-scanning module that lets drivers upload photo proof of delivery on site, replacing WhatsApp messages.

          **Infrastructure, Security & Observability:**
          - Published internal tools securely behind an <mark>Nginx</mark> reverse proxy with SSL certificates from <mark>Certbot</mark>.
          - Built virtualized clusters on <mark>Proxmox</mark>, later migrating to <mark>XCP-ng</mark> for enterprise VM management, snapshot backups, and disaster recovery.
          - Managed ~250 endpoints with <mark>FleetDM</mark>, writing automation scripts to block USB ports and auto-configure VNC access through <mark>Apache Guacamole</mark>.
          - Deployed Nginx observability with <mark>Grafana</mark>, <mark>Mimir</mark>, <mark>Loki</mark>, and <mark>Alloy</mark>.

      - layout: left
        title: Centro empresarial de Jalisco S.P.
        #link: boringcompany.com
        # link_text: boringcompany.com
        sub_title: IT Intern
        caption: January 2023 - 2024
        description: | # this will include new lines to allow paragraphs
          Provided IT support and network management while administering <mark>Windows Server</mark> infrastructure and <mark>CONTPAQi</mark> services. Automated core IT workflows—including internal app auto-updaters and service uptime monitoring—and configured a robust server backup system using <mark>Bacula</mark>.

